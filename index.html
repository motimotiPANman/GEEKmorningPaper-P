<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>GEEK Morning Paper｜公開アーカイブ</title><style>
:root{color-scheme:light}body{margin:0;font:16px/1.65 system-ui,-apple-system,"Noto Sans JP",sans-serif;background:#f4f6f9;color:#182331}
main{max-width:870px;margin:0 auto;padding:20px}header{padding:34px 0 20px}h1{font-size:clamp(1.7rem,5vw,2.5rem);letter-spacing:-.03em}
.card{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:23px;margin:18px 0}a{color:#1260a5}small,.muted{color:#5d6978}li{margin:9px 0}
footer{padding:32px 0;font-size:.85rem;color:#617080}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cad5df;border-radius:9px;font:inherit}
</style></head><body><main><header><div class="muted">OPEN TECH / ROBOTICS / HARDWARE MODDING</div><h1>GEEK Morning Paper</h1><p>技術フォーラムや個人製作から、工作機械・ロボティクス・改造・オープンハードウェアの話題を集める日本語朝刊。</p></header>
<section class="card"><h2>朝刊アーカイブ</h2><p><strong>最新号：</strong><a href="daily/2026-10-28.html">2026-10-28（9件）</a></p><input type="search" id="search" placeholder="日付・タイトルを検索" aria-label="朝刊を検索"><ul id="issues"><li>公開可能な朝刊を準備中です。</li></ul></section>
<footer>GEEK Morning Paper</footer></main>
<script>
(async()=>{try{const response=await fetch('./issues.json',{cache:'no-store'});if(!response.ok)throw Error('not found');const issues=await response.json();const list=document.getElementById('issues');const input=document.getElementById('search');const render=()=>{let q=input.value.toLocaleLowerCase();const matches=issues.filter(x=>(x.date+' '+(x.title||'')).toLocaleLowerCase().includes(q));list.replaceChildren(...matches.map(x=>{const li=document.createElement('li'),a=document.createElement('a');a.href=x.path;a.textContent=x.date+' — '+(x.title||'GEEK朝刊');li.append(a);return li}));if(!matches.length){const li=document.createElement('li');li.textContent='公開済みの該当号はありません。';list.append(li)}};input.addEventListener('input',render);render()}catch(e){document.getElementById('issues').textContent='公開可能な朝刊を準備中です。'}})();
</script></body></html>
